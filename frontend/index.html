<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electrolyte Solutions</title>
</head>

<body>
  <!-- Premium SpectraNoise Background (Reference: Framer Spectra) -->
  <canvas id="bg-canvas"
    style="position: fixed; inset: 0; z-index: -1; background: #000; pointer-events: none;"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height;
      let time = 0;

      // Configuration for "Vibrant Emerald Spectra"
      const config = {
        blobs: [
          { x: 0.3, y: 0.3, r: 0.7, color: 'rgba(16, 185, 129, 0.6)', speedX: 0.6, speedY: 0.8 },
          { x: 0.7, y: 0.4, r: 0.6, color: 'rgba(5, 150, 105, 0.55)', speedX: -0.5, speedY: 0.9 },
          { x: 0.4, y: 0.7, r: 0.8, color: 'rgba(20, 184, 166, 0.5)', speedX: 0.7, speedY: -0.6 },
          { x: 0.2, y: 0.8, r: 0.5, color: 'rgba(16, 185, 129, 0.45)', speedX: -0.8, speedY: -0.5 }
        ]
      };

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      // Pre-render noise pattern for high performance
      let noiseCanvas = document.createElement('canvas');
      let nctx = noiseCanvas.getContext('2d');
      let noisePattern;

      function initNoise() {
        noiseCanvas.width = 256;
        noiseCanvas.height = 256;
        const nData = nctx.createImageData(256, 256);
        for (let i = 0; i < nData.data.length; i += 4) {
          const v = Math.random() * 255;
          nData.data[i] = v; nData.data[i + 1] = v; nData.data[i + 2] = v; nData.data[i + 3] = 25; // Tactile grain
        }
        nctx.putImageData(nData, 0, 0);
        noisePattern = ctx.createPattern(noiseCanvas, 'repeat');
      }

      function drawBlob(blob, t) {
        // Organic, sweeping motion with balanced range
        const moveX = Math.sin(t * blob.speedX) * 0.28;
        const moveY = Math.cos(t * blob.speedY) * 0.28;
        const x = (blob.x + moveX) * width;
        const y = (blob.y + moveY) * height;
        const radius = blob.r * Math.max(width, height);

        const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
        grad.addColorStop(0, blob.color);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function render(now) {
        time = now * 0.0016; // Balanced time scale

        ctx.globalCompositeOperation = 'source-over';
        // Deep industrial base gradient
        const bgGrad = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width);
        bgGrad.addColorStop(0, '#04120d');
        bgGrad.addColorStop(1, '#000');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        // Render emerald spectral blobs
        config.blobs.forEach(b => drawBlob(b, time));

        // Apply grain texture overlay
        if (noisePattern) {
          ctx.globalCompositeOperation = 'overlay';
          ctx.fillStyle = noisePattern;
          ctx.fillRect(0, 0, width, height);
        }

        requestAnimationFrame(render);
      }

      window.addEventListener('resize', () => {
        resize();
        noisePattern = ctx.createPattern(noiseCanvas, 'repeat');
      });

      resize();
      initNoise();
      requestAnimationFrame(render);
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
